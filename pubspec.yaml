name: iwindoor_mobil
description: "Pencere/kapı tasarım uygulaması (Android, iOS, Windows, macOS, Linux)."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Çizim motoru, tasarım modeli ve kesim listesi (saf Dart, testleri: packages/windoor_core/test)
  windoor_core:
    path: packages/windoor_core

  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  shared_preferences: ^2.2.2

  # PDF rapor (lib/services/pdf_service.dart kullanıyor; önceden yanlışlıkla dev_dependencies altındaydı)
  pdf: ^3.10.8
  printing: ^5.11.1
  path_provider: ^2.1.2
  file_picker: ^13.3.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
